name: Actualizar IPTV Canales

on:
  schedule:
    - cron: '0 */4 * * *' # Cada 4 horas
  workflow_dispatch:

jobs:
  run-extractor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar script extractor
        run: python extractor.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Actualización automática de canales N+ y Multimedios [skip ci]" || echo "Sin cambios"
          git push
